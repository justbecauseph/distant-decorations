name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-modrinth:
    name: Publish to Modrinth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify release version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"

          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"

          echo "Git tag:      $TAG"
          echo "Gradle mod:   $MOD_VERSION"

          if [ "$TAG" != "$MOD_VERSION" ]; then
            echo "::error::Release tag v$TAG does not match mod_version=$MOD_VERSION"
            exit 1
          fi

      - name: Build and test
        run: ./gradlew clean build

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_CHANGELOG: ${{ github.event.release.body }}
          MODRINTH_VERSION_TYPE: ${{ github.event.release.prerelease && 'beta' || 'release' }}
        run: ./gradlew modrinth modrinthSyncBody