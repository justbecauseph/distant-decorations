plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"distantdecorations" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		integrationClient {
			client()
			name "Integration Client Benchmark"
			runDir "run-integration"
			vmArgs "-XX:+UnlockDiagnosticVMOptions", "-XX:+DebugNonSafepoints", "-Xms2G", "-Xmx4G"
			property "distantdecorations.benchmark_mode", "true"
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "distantdecorations-gametest"

		enableGameTests = true
		enableClientGameTests = false

		// Required to run server GameTests.
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "maven.modrinth:chunky:${project.chunky_version}"
	compileOnly "maven.modrinth:voxy:${project.voxy_version}"

	runtimeOnly "maven.modrinth:voxy:${project.voxy_version}"
	runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
}
